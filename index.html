<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IoT Lamp Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    :root {
      --bg: #0a0b10;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #00d2ff;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --danger: #cf6679;
      --danger-hover: #b35667;
      --success: #4ade80;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 0% 0%, #1e293b 0%, transparent 50%), radial-gradient(circle at 100% 100%, #0c4a6e 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-dot {
      width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 15px var(--accent);
    }
    .badge {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: var(--success);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-offline {
       background: rgba(207, 102, 121, 0.1);
       border: 1px solid rgba(207, 102, 121, 0.2);
       color: var(--danger);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    }
    .status-offline .dot { background: var(--danger); }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      flex-grow: 1;
    }
    @media (min-width: 900px) {
      .main-layout { grid-template-columns: 280px 1fr; }
    }

    .sensor-panel { display: flex; flex-direction: column; gap: 24px; }
    .glass-card {
       background: var(--card); border: 1px solid var(--border);
       backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
       border-radius: 24px; padding: 24px;
    }
    .sensor-card { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .sensor-label { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
    .sensor-value { font-size: 48px; font-weight: 300; margin: 10px 0; color: var(--text); }

    .master-controls { display: flex; flex-direction: column; gap: 16px; min-width: 100%; }
    @media (min-width: 900px) {
      .master-controls { flex-direction: column; }
    }
    .master-controls-row {
      display: flex; gap: 16px;
    }

    .btn {
       flex: 1; padding: 14px; border-radius: 16px; border: 1px solid var(--border);
       background: var(--card); color: white; font-weight: 600; cursor: pointer;
       text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; transition: all 0.2s;
    }
    .btn:hover { background: rgba(0, 210, 255, 0.1); border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { background: rgba(207, 102, 121, 0.1); border-color: var(--danger); color: var(--danger); }

    .lamps-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
    }
    .lamp-card {
      display: flex; flex-direction: column; gap: 16px; transition: all 0.3s ease; align-items: flex-start;
    }
    .lamp-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .lamp-icon {
       width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,0.05);
       display: flex; align-items: center; justify-content: center; font-size: 24px; transition: all 0.3s;
    }
    .lamp-on .lamp-icon { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }
    .lamp-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }

    .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 100px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 2px; top: 2px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: var(--accent); border-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(24px); }

    .log-panel { height: 200px; margin-top: 24px; display: flex; flex-direction: column; }
    .log-title { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; padding-left: 4px; display: flex; justify-content: space-between; align-items: center;}
    .clear-log { font-size: 12px; color: var(--text-dim); background: none; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; margin-left:auto;}
    .clear-log:hover { color: var(--danger); text-decoration: underline; }
    .log-content { flex: 1; overflow-y: auto; font-family: monospace; font-size: 12px; padding: 16px; color: var(--text-dim); }
    .log-list { list-style-type: none; }
    .log-list li { margin-bottom: 6px; display: flex; gap: 12px; }
    .log-time { color: var(--accent); white-space: nowrap; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <header>
    <h1><div class="logo-dot"></div>Smart IoT Dashboard</h1>
    <div id="mqtt-status" class="badge"><div class="dot"></div> Menghubungkan...</div>
  </header>

  <div class="main-layout">
    <div class="sensor-panel">
      <div class="glass-card sensor-card">
        <span class="sensor-label">Suhu</span>
        <div class="sensor-value" id="temp-display">-- °C</div>
      </div>
      <div class="glass-card sensor-card">
        <span class="sensor-label">Kelembapan</span>
        <div class="sensor-value" id="humid-display">-- %</div>
      </div>
      <div class="master-controls">
        <div class="master-controls-row">
            <button class="btn btn-primary" onclick="setAll(true)">Semua ON</button>
            <button class="btn btn-danger" onclick="setAll(false)">Semua OFF</button>
        </div>
      </div>
    </div>

    <div class="lamps-grid">
      <!-- Lamp 1 -->
      <div class="glass-card lamp-card" id="card-1">
        <div class="lamp-header">
          <div class="lamp-icon">💡</div>
          <label class="switch">
            <input type="checkbox" id="relay-1" onchange="toggleRelay(1)">
            <span class="slider"></span>
          </label>
        </div>
        <div>
          <div class="lamp-title">Lampu 1</div>
          <div style="font-size:12px;color:var(--text-dim)">Relay 1</div>
        </div>
      </div>
      <!-- Lamp 2 -->
      <div class="glass-card lamp-card" id="card-2">
        <div class="lamp-header">
          <div class="lamp-icon">💡</div>
          <label class="switch">
            <input type="checkbox" id="relay-2" onchange="toggleRelay(2)">
            <span class="slider"></span>
          </label>
        </div>
        <div>
          <div class="lamp-title">Lampu 2</div>
          <div style="font-size:12px;color:var(--text-dim)">Relay 2</div>
        </div>
      </div>
      <!-- Lamp 3 -->
      <div class="glass-card lamp-card" id="card-3">
        <div class="lamp-header">
          <div class="lamp-icon">💡</div>
          <label class="switch">
            <input type="checkbox" id="relay-3" onchange="toggleRelay(3)">
            <span class="slider"></span>
          </label>
        </div>
        <div>
          <div class="lamp-title">Lampu 3</div>
          <div style="font-size:12px;color:var(--text-dim)">Relay 3</div>
        </div>
      </div>
      <!-- Lamp 4 -->
      <div class="glass-card lamp-card" id="card-4">
        <div class="lamp-header">
          <div class="lamp-icon">💡</div>
          <label class="switch">
            <input type="checkbox" id="relay-4" onchange="toggleRelay(4)">
            <span class="slider"></span>
          </label>
        </div>
        <div>
          <div class="lamp-title">Lampu 4</div>
          <div style="font-size:12px;color:var(--text-dim)">Relay 4</div>
        </div>
      </div>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-title">
      Activity Log
      <button class="clear-log" onclick="clearLog()">Clear</button>
    </div>
    <div class="glass-card log-content">
      <ul class="log-list" id="log-list">
        <!-- Logs appear here -->
      </ul>
    </div>
  </div>

  <script>
    const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
    const topicRelay = "smarthome/relay";
    const topicSensor = "smarthome/sensor";
    
    // Connect to MQTT broker
    const client = mqtt.connect(brokerUrl);
    
    const statusEl = document.getElementById('mqtt-status');
    const tempEl = document.getElementById('temp-display');
    const humidEl = document.getElementById('humid-display');
    const logList = document.getElementById('log-list');

    function addLog(message) {
      const li = document.createElement('li');
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second:'2-digit' });
      li.innerHTML = `<span class="log-time">[${timeStr}]</span> <span>${message}</span>`;
      logList.insertBefore(li, logList.firstChild);
      
      // keep only last 50 logs
      if(logList.children.length > 50) {
        logList.removeChild(logList.lastChild);
      }
    }
    
    function clearLog() {
      logList.innerHTML = '';
      addLog("Log cleared");
    }

    client.on('connect', () => {
      statusEl.innerHTML = '<div class="dot"></div> Terhubung (Online)';
      statusEl.className = 'badge status-online';
      addLog("Berhasil terhubung ke broker MQTT.");
      
      // Subscribe to sensors
      client.subscribe(topicSensor, (err) => {
        if (!err) {
          addLog(`Subscribed ke topik: ${topicSensor}`);
        } else {
          addLog(`Gagal subscribe: ${err}`);
        }
      });
    });

    client.on('message', (topic, message) => {
      const msg = message.toString();
      if(topic === topicSensor) {
        // Format: "Suhu: 27.5C | Kelembapan: 65.2%"
        try {
          const parts = msg.split('|');
          if(parts.length === 2) {
            const t = parts[0].replace('Suhu:', '').trim();
            const h = parts[1].replace('Kelembapan:', '').trim();
            tempEl.innerText = t || '-- °C';
            humidEl.innerText = h || '-- %';
          }
        } catch(e) {
          console.error("Failed parsing sensor data:", e);
        }
      }
    });

    client.on('offline', () => {
      statusEl.innerHTML = '<div class="dot"></div> Terputus (Offline)';
      statusEl.className = 'badge status-offline';
      addLog("Terputus dari broker MQTT.");
    });
    
    client.on('reconnect', () => {
      statusEl.innerHTML = '<div class="dot"></div> Menghubungkan ulang...';
      statusEl.className = 'badge status-offline';
    });

    client.on('error', (err) => {
      addLog(`MQTT Error: ${err.message}`);
    });

    function publishCommand(cmd) {
      if(client.connected) {
        client.publish(topicRelay, cmd);
        addLog(`Sent command: ${cmd}`);
      } else {
        addLog(`Gagal kirim cmd '${cmd}', MQTT terputus.`);
      }
    }

    function updateLampUI(index, isOn) {
      const card = document.getElementById(`card-${index}`);
      const checkbox = document.getElementById(`relay-${index}`);
      checkbox.checked = isOn;
      if(isOn) {
        card.classList.add('lamp-on');
      } else {
        card.classList.remove('lamp-on');
      }
    }

    function toggleRelay(index) {
      const checkbox = document.getElementById(`relay-${index}`);
      const isOn = checkbox.checked;
      const cmd = `relay${index}_${isOn ? 'on' : 'off'}`;
      
      updateLampUI(index, isOn);
      publishCommand(cmd);
    }

    function setAll(turnOn) {
      for(let i=1; i<=4; i++) {
        updateLampUI(i, turnOn);
      }
      publishCommand(turnOn ? 'all_on' : 'all_off');
    }
  </script>
  <!-- VOICE CONTROL -->
<div style="margin-top:1.5rem;">
  <div class="section-label">Perintah Suara</div>
  <div style="background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:1rem;">
    <button id="voiceBtn" onclick="startVoice()" style="width:100%;padding:12px;border-radius:8px;border:1px solid #e8e8e0;background:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
      🎤 Tekan untuk berbicara
    </button>
    <div id="voiceResult" style="margin-top:8px;font-size:13px;color:#888;text-align:center;min-height:20px;"></div>
  </div>
</div>

<script>
function startVoice() {
  const btn = document.getElementById("voiceBtn");
  const result = document.getElementById("voiceResult");

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    result.textContent = "Browser tidak support perintah suara.";
    return;
  }

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'id-ID';
  recognition.interimResults = false;

  btn.textContent = "🔴 Mendengarkan...";
  btn.style.borderColor = "#d85a30";
  btn.style.color = "#d85a30";

  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript.toLowerCase();
    result.textContent = 'Terdengar: "' + text + '"';
    processVoice(text);
  };

  recognition.onerror = function() {
    result.textContent = "Gagal mendengar, coba lagi.";
    btn.textContent = "🎤 Tekan untuk berbicara";
    btn.style.borderColor = "#e8e8e0";
    btn.style.color = "#1a1a1a";
  };

  recognition.onend = function() {
    btn.textContent = "🎤 Tekan untuk berbicara";
    btn.style.borderColor = "#e8e8e0";
    btn.style.color = "#1a1a1a";
  };
}

function processVoice(text) {
  const result = document.getElementById("voiceResult");
  let cmd = null;

  if (text.includes("variasi 1") || text.includes("variasi satu")) cmd = "variasi1";
  else if (text.includes("variasi 2") || text.includes("variasi dua")) cmd = "variasi2";
  else if (text.includes("semua") && (text.includes("nyala") || text.includes("hidup") || text.includes("on"))) cmd = "all_on";
  else if (text.includes("semua") && (text.includes("mati") || text.includes("off") || text.includes("padam"))) cmd = "all_off";
  else if ((text.includes("nyala") || text.includes("hidup") || text.includes("on")) && (text.includes("satu") || text.includes("1"))) cmd = "relay1_on";
  else if ((text.includes("mati") || text.includes("off")) && (text.includes("satu") || text.includes("1"))) cmd = "relay1_off";
  else if ((text.includes("nyala") || text.includes("hidup") || text.includes("on")) && (text.includes("dua") || text.includes("2"))) cmd = "relay2_on";
  else if ((text.includes("mati") || text.includes("off")) && (text.includes("dua") || text.includes("2"))) cmd = "relay2_off";
  else if ((text.includes("nyala") || text.includes("hidup") || text.includes("on")) && (text.includes("tiga") || text.includes("3"))) cmd = "relay3_on";
  else if ((text.includes("mati") || text.includes("off")) && (text.includes("tiga") || text.includes("3"))) cmd = "relay3_off";
  else if ((text.includes("nyala") || text.includes("hidup") || text.includes("on")) && (text.includes("empat") || text.includes("4"))) cmd = "relay4_on";
  else if ((text.includes("mati") || text.includes("off")) && (text.includes("empat") || text.includes("4"))) cmd = "relay4_off";
  else if (text.includes("nyala") || text.includes("hidup") || text.includes("on")) cmd = "all_on";
  else if (text.includes("mati") || text.includes("off") || text.includes("padam")) cmd = "all_off";

  if (cmd && client && client.connected) {
  client.publish(topicRelay, cmd);
  result.style.color = "#3b6d11";
  result.textContent += ' → Perintah "' + cmd + '" dikirim!';
  addLog(`Voice command: ${cmd}`);
  } else if (!cmd) {
    result.style.color = "#d85a30";
    result.textContent += " → Perintah tidak dikenali.";
  }
}
</script>
</body>
</html>
